<html lang="en">
<head>

<body>
    <div id="header-placeholder"></div>
    <div id="banner-fest-header"></div>
    <div id="banner-fest-header2"></div>
    <div id="module-items">
		<main id="items-bag">
		    <!-- Search and Filter Bar -->
		    <div id="search-div">
		        <div id="search-box">
		            🔍<input type="text" id="searchInput" onkeyup="filterProducts()" placeholder="Search by model name or category (e.g. Elena, 8 Kg)...">
		        </div>
		        
		        <div id="search-category">
		            <button onclick="setCategory('ALL')">All</button>
		        </div>
		    </div>
		    
		    <!-- Product Cards Container -->
		    <div id="productGrid"></div>
		</main>
		
	</div>
    <div id="banner-fest-footer"></div>

    <script src="https://nkg26.github.io/NE/2K6/items-ifb-01.js"></script>

    <script src="https://nkg26.github.io/NE/2K6/js/products.js"></script>
	
    <script>  
	  function setCategory(cat) {
            selectedCategory = cat;
            document.querySelectorAll('.cat-btn').forEach(btn => {
                btn.className = null;
            });
            event.target.className = "cat-btn px-4 py-2 rounded-lg text-sm font-medium bg-amber-500 text-white whitespace-nowrap";
            renderProducts();
        }
		
		function renderProducts() {
			const grid = document.getElementById('productGrid');
			if(grid === null){
				console.log("null element having id productGrid");
				return;
			}
			var searchVal = '';
			try{
				var el = document.getElementById('searchInput');
				searchVal = el===null?'':el.value.toLowerCase();
			}catch(e){
				console.log(e);
			}
			grid.innerHTML = '';
			
			var productList = getProducts_Category(selectedCategory);
			var output = getnerateSimpleTable(productList);
			grid.innerHTML = output;
			
			
		}
		setTimeout(renderProducts,1000);  
	</script>
  
</body></html>
