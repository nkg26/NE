    <!-- Main Container -->
    <main class="max-w-6xl mx-auto px-4 py-8">
        
        <!-- Search and Filter Bar -->
        <div class="bg-white p-4 rounded-xl shadow-md border border-slate-200 mb-6 flex flex-col md:flex-row gap-4 justify-between items-center">
            <div class="relative w-full md:w-1/3">
                <i class="fas fa-search absolute left-3 top-3.5 text-slate-400"></i>
                <input type="text" id="searchInput" onkeyup="filterProducts()" placeholder="Search by model name or category (e.g. Elena, Top Load, 8 Kg)..." class="w-full pl-10 pr-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-amber-500">
            </div>
            
            <div class="flex gap-2 w-full md:w-auto overflow-x-auto pb-1 md:pb-0">
                <button onclick="setCategory('ALL')" 				class="cat-btn px-4 py-2 rounded-lg text-sm font-medium bg-amber-500 text-white whitespace-nowrap">All</button>
                <button onclick="setCategory('Refrigerator')" class="cat-btn px-4 py-2 rounded-lg text-sm font-medium bg-slate-100 hover:bg-slate-200 text-slate-700 whitespace-nowrap">Fridge</button>
                <button onclick="setCategory('Top Load')" 		class="cat-btn px-4 py-2 rounded-lg text-sm font-medium bg-slate-100 hover:bg-slate-200 text-slate-700 whitespace-nowrap">Top Load</button>
                <button onclick="setCategory('Front Load')" 	class="cat-btn px-4 py-2 rounded-lg text-sm font-medium bg-slate-100 hover:bg-slate-200 text-slate-700 whitespace-nowrap">Front Load</button>
                <button onclick="setCategory('MWO')" 				class="cat-btn px-4 py-2 rounded-lg text-sm font-medium bg-slate-100 hover:bg-slate-200 text-slate-700 whitespace-nowrap">Microwaves</button>
                <button onclick="setCategory('Dishwasher')" 	class="cat-btn px-4 py-2 rounded-lg text-sm font-medium bg-slate-100 hover:bg-slate-200 text-slate-700 whitespace-nowrap">Dishwashers</button>
                <button onclick="setCategory('Cloth Dryer')" 	class="cat-btn px-4 py-2 rounded-lg text-sm font-medium bg-slate-100 hover:bg-slate-200 text-slate-700 whitespace-nowrap">CD</button>
                <button onclick="setCategory('WDR')" 				class="cat-btn px-4 py-2 rounded-lg text-sm font-medium bg-slate-100 hover:bg-slate-200 text-slate-700 whitespace-nowrap">WDR</button>
            </div>
        </div>

        <!-- Product Cards Container -->
        <div id="productGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 lg:grid-cols-4 gap-6">
            <!-- Dynamic JS Injected Cards -->
        </div>
		
		<!-- Script / Data -->
		<script src="https://nkg26.github.io/NE/2K6/items-ifb-01.js"></script>
		<script src="https://nkg26.github.io/NE/2K6/items-ifb-02.js"></script>
				<!-- <script src="items-ifb-02.js"></script> -->

		<!-- <script src="https://cdn.tailwindcss.com"></script> -->
		<script> renderProducts(); </script>

    </main>
