		<script>

	//	function openPage(val){alert('currently no page exist..'+val);};

		function _start_this(){
			ITEMS.cat_btn_cls_selected   = "cat-btn px-4 py-2 rounded-lg text-sm font-medium bg-amber-500 text-white whitespace-nowrap";
			ITEMS.cat_btn_cls_unselected = "cat-btn px-4 py-2 rounded-lg text-sm font-medium bg-slate-100 hover:bg-slate-200 text-slate-700 whitespace-nowrap";
			ITEMS.cat_btn_cls = "cat-btn";
			init_item_data(); // initialize items...
			
			let CATs = ITEMS.getUniqueCategory(ITEMS.ALL_ITEMS);		
			document.getElementById("search-category").innerHTML = ITEMS.generateHtmlButtons_Category(CATs);
			ITEMS.setCategory(null);
		}
					
		function _to_item_map_list(data){
			var indx = ITEMS.FX_TABLE.findHeaderIndex(data,"n-category");
			if(indx >=0) data[0][indx] = "category";
			return (ITEMS.FX_TABLE.toKeyMapObjectList(data));
		}
			
		function init_item_data(){
			var P1 = _to_item_map_list(items_table_ifb);
			var P2 = _to_item_map_list(items_table_mix);
			var P3 = _to_item_map_list(items_table_other);
			
			P1 = P1.concat(P2).concat(P3);
			var MRP = _to_item_map_list(items_tabl_price);
			
			ITEMS.FX_TABLE.merge_KeyMapObjects(P1, MRP, 'nsap');

			ITEMS.ALL_ITEMS = P1;
		}

		function setCategory(cat){
			ITEMS.setCategory(cat);
		}
		
		function show_filtered_products(){
			ITEMS.update_textFilter();
		}
		
		class MyItem_Table extends MyItem2{
		
			generate_all_items_HTML_VIEW(itemList) {
				let html = `
						<style>
								table.simple_table{min-width:1000px;  border:1px solid seagreen;}
								.simple_table td {border:1px solid gray; padding: 3px 5px;}
								.simple_table th {border:1px solid gray; background-color:cyan;}
						</style>
				`;
				html +="<table cellspacing=0 border=true class='simple_table' id='simple_table'>";
				html +="<thead><tr><th>Cat</th><th>Cap</th><th>Name</th><th>MRP</th><th>DP</th><th>Color</th></tr></thead>";
				
				html +="<tbody>";
				
				for(let r=0; r<itemList.length; r++){
					let p = itemList[r];
				  html += `<tr> <td>${this.getItemCategory(p)} </td><td>${p.capacity} </td><td>${p.name} </td><td>₹ ${this.safeLocaleString(p.mrp)} </td><td>₹ ${this.safeLocaleString(p.dp)}</td><td>${p.color} </td></tr>`;
				}
					
				html +="<tbody>";
				html +="</table>";
				return html;
			}
		}
		const ITEMS = new MyItem_Table();
		_start_this();
		</script>
		
		<div style="font-size:6px;">NE> 2K6 >all-products</div>
