    <script>
//        loadHTML('header-placeholder', 'https://nkg26.github.io/NE/resources/header.html');
//       loadHTML('footer-placeholder', 'https://nkg26.github.io/NE/resources/footer.html');

	setTimeout(_start_this,100);
	function _start_this(){
		cat_btn_cls_selected   = "cat-btn px-4 py-2 rounded-lg text-sm font-medium bg-amber-500 text-white whitespace-nowrap";
		cat_btn_cls_unselected = "cat-btn px-4 py-2 rounded-lg text-sm font-medium bg-slate-100 hover:bg-slate-200 text-slate-700 whitespace-nowrap";
		cat_btn_cls = "cat-btn";
		init_item_data(); // initialize items...
		document.getElementById("search-category").innerHTML = createHTML_CategoryButtons();
		var cat = getUrlValue("category");
		cat = cat===undefined?null:cat;
		cat = cat===''?null:cat;
		console.log("initial category = "+cat);
		setCategory(cat);
		//setTimeout(render_and_show_items,1000);  
	}
				
	function _to_item_map_list(data){
		var indx = findHeaderIndex(data,"n-category");
		if(indx >=0) data[0][indx] = "category";
		return (convertTableToScriptArrayObject(data));
	}
		
	function init_item_data(){
		var P1 = _to_item_map_list(items_table_ifb);
		var P2 = _to_item_map_list(items_table_mix);
		var P3 = _to_item_map_list(items_table_other);
		
		P1 = P1.concat(P2).concat(P3);
		var MRP = _to_item_map_list(items_tabl_price);
		merge_data_mapArray(P1, MRP, 'nsap');

		products = P1;
	}

	function getItemCategory(p){
		var cat = p.category;
		if(cat === "WM") return "Washing Machine";
		if(cat === "REF") return "Refrigerator";
		if(cat === "OVEN") return "Microwave Oven";
		if(cat === "LED") return "LED TV";
		if(cat === "CD") return "Cloth Dryer";
		return cat;
	}
		
	function getItemImage(p){
		try{
		return get_item_img_tag(p); /* NE/brands/prod-img.js*/
		}catch{}
		return '';
	}		
	
	// @override
	function generate_one_item_HTML_VIEW(p){
		return `
		<div class="bg-white rounded-2xl shadow-md hover:shadow-xl transition-all p-5 border border-slate-100 flex flex-col justify-between">
			<div> <div class="flex justify-between items-start mb-2">
					<span class="text-xs font-semibold px-2.5 py-1 bg-amber-100 text-amber-800 rounded-full">${getItemCategory(p)}</span>
				</div>
					<span class="text-xs text-slate-400 font-medium">${p.capacity}</span>
				<h3 class="font-bold text-slate-800 text-lg mb-1">${p.name}</h3>
				<p class="text-xs text-slate-500 mb-4">Color: ${p.color}</p>
				${getItemImage(p)}
				<div class="bg-slate-50 p-3 rounded-xl mb-4 border border-slate-100">
					<div class="flex justify-between text-xL text-slate-1000 mb-1">
						<span>MRP: ₹${safeLocaleString(p.mrp)}</span>
					</div>
				</div>
			</div>
		</div>`;
	}
	</script>
