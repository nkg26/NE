<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <!-- Mobile responsiveness ke liye critical viewport tag -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PVT-NK</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      display: flex;
      height: 100vh;
      background-color: #f4f6f9;
      overflow: hidden;
    }

    /* Mobile Header (Mobile screen par show hoga) */
    .mobile-header {
      background: #4f46e5;
      color: white;
      _padding: 12px 15px;
      align-items: center;
      justify-content: space-between;
    }

    .mobile-header button {
      background: rgba(255, 255, 255, 0.2);
      border: none;
      color: red;
      padding: 2px 5px;
      font-size: 16px;
      border-radius: 6px;
      cursor: pointer;
    }


    /* Center Main Content Area */
    .main-wrapper {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100vh;
      width: 100%;
    }

    .main-content {
      flex: 1;
      padding: 10px;
    }

    /* Center Iframe */
    .center-iframe {
      width: 100%;
      height: 100%;
      border: 2px solid #e5e7eb;
      border-radius: 10px;
      background: white;
    }

    /* ======================================= */
    /* Mobile Screen Responsive CSS Rules      */
    /* ======================================= */
    @media (max-width: 768px) {
      body {
        flex-direction: column;
      }

      /* Mobile header show hoga */
      .mobile-header {
        display: flex;
      }

      .main-wrapper {
        height: calc(100vh - 50px);
      }
    }
	
	/* Chrome, Safari, aur New Edge ke liye */
	::-webkit-scrollbar {
		width: 5px;  /* Vertical scrollbar ki चौड़ाई (width) */
		height: 5px; /* Horizontal scrollbar ki ऊँचाई (height) */
	}


	.main-content{border:0px solid red; max-height:100vh; overflow:auto;}
	
	a				{text-decoration: none; text-align:left; color:seagreen;}
	a:hover	{background-color:black; color:white;}

	div#main-links a{
			display: inline-block; 
			padding:5px; 
			margin:4px 10px; 
			border-radius:8px; 
			white-space: nowrap;
			
			overflow:auto;
			scrollbar-width: thin; /* Options: auto | thin | none */
			
			
			min-width:170px;
			max-width:30vw;
			font-size:1.0em; 
			
			color:black;
			background-color:pink;
		}
		
	.if{color:#222222; padding:2px 6px; font-size:0.8em; border-radius:5px; vertical-align:center;}
	.if:hover{ background-color:cyan; }
	
	.link2{ text-align:center; font-size:0.8em; border:1px solid red; padding:3px 6px; border-radius:5px; }
	.link2:hover{ background-color:cyan; border:1px solid blue; }
	
	.mobile-header button:hover{ background-color:cyan; }
	.mobile-header{background-color:pink; }
	body{background:none; background-color:gray; }
	
	</style>
</head>

<body>

  <div class="main-wrapper">
    <!-- Mobile Header Bar -->
    <div class="mobile-header">
      <button id="b1" onclick="showLinksPane()">☰ L </button>
      <button id="b2" onclick="showFramePane()">☰ F </button>
	  <a class="link2" id="reload">NK</a>
	  <a class="link2" id="ifb"> IFB </a>
	  <div class="if"> <input checked type="checkbox" id="cb1"> <label for="cb1"> iFrame</label> </div>
    </div>

  <div id="asd"></div>
    <div class="main-content">
		<div class="my-links" id="main-links"></div>
		<iframe id="center-iframe" name="center-frame" class="center-iframe" src="" target="_blank" ></iframe>
    </div>
  </div>

  <script>
//		window.location.href = "https://example.com"; // open in same tab...
//		window.open("https://example.com", "_blank"); // open in new tab

	  document.getElementById("reload").href = window.location.href;
	  document.getElementById("ifb").href = "https://nkg26.github.io/ifb/see.html";

  var UrlKeyMap;
  window.addEventListener('DOMContentLoaded', () => {UrlKeyMap = new URLSearchParams(window.location.search);});
  
  // menu links and all...
  const TAB = [
	{url:"https://nkg26.github.io/NE", name:"Home"},
	{url:"https://nkg26.github.io/NE/consumer.html", name:"Customer"},
	{url:"https://nkg26.github.io/NE/testing/txtreader.html", name:"Dynamic File"},
	{url:"https://nkg26.github.io/NE/shop/nepvt-products-table.html", name:"pvt-tab"},
	{url:"https://nkg26.github.io/NE/2K6/all-products.html", name:"All Products - Card"},
	{url:"https://nkg26.github.io/NE/2K6/all-products-table.html", name:"AllProduct - Table"},
	{url:"https://nkg26.github.io/NE/resources/pvt-all-qr.html", name:"Payment QR"},
	{url:"https://nkg26.github.io/NE/resources/bajaj-finanace.html", name:"Bajaj Finance"},
	{url:"https://nkg26.github.io/NE/resources/location-ne.html", name:"Google Location"},
	{url:"https://nkg26.github.io/NE/resources/contact-us.html", name:"Contact Us"},
	{url:"https://nkg26.github.io/NE/tmp/naveen.html", name:"Naveen"}
  ];

const RN_KEY = 'rnd='+Math.floor(Math.random()*10000);
	  	  
  function openX(index){
	let p  = TAB[index];
	let sel = document.getElementById("cb1").checked;
	let url  = p.url;
	
	url += (url.includes("?")?";":"?")+RN_KEY;
	//alert(url); return;

	if(sel){
		showFramePane();
		document.getElementById("center-iframe").src=url;
	}else{
		window.location.href = url; // open in same tab...
	}
  }
  
  function showLinksPane(){
	document.getElementById("b2").style.display='inline';
	document.getElementById("b1").style.display='none';
	document.getElementById("center-iframe").style.display='none';
	document.getElementById("main-links").style.display='block';
  }
  function showFramePane(){
	document.getElementById("b1").style.display='inline';
	document.getElementById("b2").style.display='none';
	document.getElementById("center-iframe").style.display='block';
	document.getElementById("main-links").style.display='none';
  }
  
  
  function getObjectById(ID, start=0){
	for(var i=(start<0?0:start); i<TAB.length; i++){
	  if(TAB[i] !==null && TAB[i].id === ID) return TAB[i];
	}
	return null;
 }
  
  
  var html = '';
  for(let i=0;i<TAB.length;i++){
	  html += `<a href="javascript:void(0);" onclick='openX(${i})'> ${i+1}. ${TAB[i].name} </a>`;
  }
  document.getElementById("main-links").innerHTML = html;
  showLinksPane();
  
  
</script></body></html>
