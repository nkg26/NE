<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <!-- Mobile responsiveness ke liye critical viewport tag -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PVT-NK</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      display: flex;
      height: 100vh;
      background-color: #f4f6f9;
      overflow: hidden;
    }

    /* Mobile Header (Mobile screen par show hoga) */
    .mobile-header {
      background: #4f46e5;
      color: white;
      _padding: 12px 15px;
      align-items: center;
      justify-content: space-between;
    }

    .mobile-header button {
      background: rgba(255, 255, 255, 0.2);
      border: none;
      color: red;
      padding: 8px 14px;
      font-size: 16px;
      border-radius: 6px;
      cursor: pointer;
    }


    /* Center Main Content Area */
    .main-wrapper {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100vh;
      width: 100%;
    }

    .main-content {
      flex: 1;
      padding: 10px;
    }

    /* Center Iframe */
    .center-iframe {
      width: 100%;
      height: 100%;
      border: 2px solid #e5e7eb;
      border-radius: 10px;
      background: white;
    }

    /* ======================================= */
    /* Mobile Screen Responsive CSS Rules      */
    /* ======================================= */
    @media (max-width: 768px) {
      body {
        flex-direction: column;
      }

      /* Mobile header show hoga */
      .mobile-header {
        display: flex;
      }

      .main-wrapper {
        height: calc(100vh - 50px);
      }
    }
  </style>
</head>
<body>
<style>.main-content{border:0px solid red; max-height:100vh; overflow:auto;}</style>
<style>

	div#main-links a{
			display: inline-block; padding:5px; margin:4px 10px; border-radius:8px; color:black; width:200px;
				text-align:center; font-size:1.3em; color:black;
			background-color:pink;
		}
			
	div#main-links a:hover{background-color:black; color:white;}
	

	#cust-link, .link2{
		text-align:center; 	font-size:1.3em; 	padding: 2px 15px; margin:2px 5px; 
		border:2px solid blue; 	border-radius:15px; 
	}
	#cust-link:hover, .link2:hover{ background-color:cyan; }
</style>
<style>.mobile-header{background:none; }</style>
<style>.mobile-header{background-color:pink; }</style>
<style>body{background:none; background-color:gray; }</style>

  <div class="main-wrapper">
    <!-- Mobile Header Bar -->
    <div class="mobile-header">
      <button id="b1" onclick="showLinks()">☰ L </button>
      <button id="b2" onclick="showFrame()">☰ F </button>
	  <a href="nkg.html"> <span style="font-weight: bold;"> &nbsp; NK &nbsp; </span> </a>
      <span id='cust-link'></span>
	  <a class="link2" href="https://nkg26.github.io/ifb/see.html"> IFB </a>
    </div>

  <div id="asd"></div>
    <div class="main-content">
		<div class="my-links" id="main-links"></div>
		<iframe id="center-iframe" name="center-frame" class="center-iframe" src="" target="_blank" ></iframe>
    </div>
  </div>

  <script>
	
  var UrlKeyMap;
  window.addEventListener('DOMContentLoaded', () => {UrlKeyMap = new URLSearchParams(window.location.search); load_final_page()});
  
  // menu links and all...
  var TAB = [
	{id:"", url:"https://nkg26.github.io/NE", name:"Home", inMenu:true},

	{id:"", url:"https://nkg26.github.io/NE/testing/txtreader.html", name:"Dynamic File", inMenu:true},
	  
	{id:"", url:"https://nkg26.github.io/NE/shop/nepvt-products-table.html", name:"pvt-tab", inMenu:true},
	{id:"all-items", url:"https://nkg26.github.io/NE/2K6/all-products.html", name:"All Products - Card", inMenu:true},
	{id:"all-items", url:"https://nkg26.github.io/NE/2K6/all-products-table.html", name:"AllProduct - Table", inMenu:true},
	{name:"%separator%", inMenu:true},
	
	{id:"all-items", url:"https://nkg26.github.io/NE/resources/pvt-all-qr.html", name:"Payment QR", inMenu:true},
	{name:"%separator%", inMenu:true},

	  {id:"cust", url:"https://nkg26.github.io/NE/consumer.html", name:"Customer", inMenu:true},
	{name:"%separator%", inMenu:true},

	{id:"", url:"https://nkg26.github.io/NE/resources/bajaj-finanace.html", name:"Bajaj Finance", inMenu:true},

	{id:"conatct-us", url:"https://nkg26.github.io/NE/resources/contact-us.html", name:"Contact Us", inMenu:true},
	{name:"%separator%", inMenu:true},
	{id:"", url:"https://nkg26.github.io/NE/tmp/naveen.html", name:"Naveen", inMenu:true}
  ];

const RN = Math.floor(Math.random()*10000);
for(let i=0; i<TAB.length; i++) if(TAB[i] && TAB[i].url && TAB[i].url.length>10)	TAB[i].url += '?rnd='+RN;
	  
  var p = getObjectById('cust');
  document.getElementById('cust-link').innerHTML=p?`<a href="${p.url}"> cust </a>`:"";
	  
  function showLinks(){
	  document.getElementById("b2").style.display='inline';
	  document.getElementById("b1").style.display='none';
	  document.getElementById("center-iframe").style.display='none';
	  document.getElementById("main-links").style.display='block';
  }
  function showFrame(){
	  document.getElementById("b1").style.display='inline';
	  document.getElementById("b2").style.display='none';
	  
		document.getElementById("center-iframe").style.display='block';
		document.getElementById("main-links").style.display='none';
  }
  
  
  function getObjectById(ID, start=0){
	for(var i=(start<0?0:start); i<TAB.length; i++){
	  var p = TAB[i];
	  if(p!==null && p.id === ID){
		return p;
	  }
	}
 }
  
  function setIframeURLByID(ID){
	var p = ID?getObjectById(ID):null;
	setIframeURL(p?p.url:"");
  }
  function setIframeURL(URL){
	closeSidebar();
	document.getElementById("center-iframe").src=URL;
	try{
		document.getElementById("asd").innerHTML=URL;
		//document.getElementById("asd").style.display='none';
	}catch{}
 }
  
  var sidebar_menu_html = '';
  for(var i=0;i<TAB.length;i++){
	  var p = TAB[i];
	  if(p.inMenu === true){
		  if(p.name==='%separator%'){
				//sidebar_menu_html += `<br/>`;
			} else {
				// below all 3 are working fine..
				sidebar_menu_html += `<a href="${p.url}" target="center-frame" onclick="showFrame()">${p.name}</a>`;
				// sidebar_menu_html += `<a href="?id=${p.id}" >${p.name}</a>`;
				//sidebar_menu_html += `<a href="javascript:void(0);" onclick="setIframeURL('${p.url}')" > ${p.name}</a>`;
				//sidebar_menu_html += `<br/>`;
			}
		}
  }
  
  
  document.getElementById("main-links").innerHTML = sidebar_menu_html;
  showLinks();

function load_final_page(){
	var x = UrlKeyMap.get('id');
	x = x?x:"navratre";
	if(x){
		var p = getObjectById(x);
//		setIframeURL(p.url);
	}
}

</script>



</body>

</html>
