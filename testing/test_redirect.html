
<html>
  <head>
    <title>NE-Customer</title>
  </head>
<body>
  hello user...
  
  <div id="timer" class="timer"> 
    <span id="message"> </span>
  <button id="t-stop" onclick="stopRedirect()"> stop </button>
  <button id="t-go" onclick="goRedirect()"> stop </button>
	  <script>
		var redirectUrl = "https://nkg26.github.io/NE";		
		var time = 15*1000;// 5 seconds
		var cnt_timer=0;
		
		// hide stop button..
		document.getElementById("t-stop").style.display="none";
		const interval_ID = setInterval(function() {
			 cnt_timer += 1;
			 document.getElementById("t-stop").style.color=((cnt_timer%2)===0)?"Red":"green";
			 document.getElementById("t-stop").style.display="inline-block";
			try{
        // count-down message...
				document.getElementById("message").innerHTML = 'You will be redirect in '+(time -= 1000)/1000+' seconds. ';
			}catch (e){
				clearInterval(interval_ID);
				console.log("clear Interval ID = "+ interval_ID);
				console.log("error = "+ e);
			} },1000);
		
		function stopRedirect(){ 
			clearInterval(interval_ID);
			redirectUrl = null; 
			document.getElementById("timer").innerHTML = ''; 
		}
		  
		function goRedirect(){ 
			if(redirectUrl!==null) {
				clearInterval(interval_ID);
				document.getElementById("timer").innerHTML = 'now you are auto-move to new page...';
				window.location.href = redirectUrl;
			}
		}
		setTimeout(goRedirect, time); 		
	</script>
  </div>
  
</body>
</html>
