	    <style>

	<script>
	const RN = Math.floor(Math.random()*10000);
	const Append_RN_TXT = '?rnd='+RN;
		
	function goToPage() {
            const dropdown = document.getElementById("pageDropdown");
            const selectedValue = dropdown.value;
            if (selectedValue) {
                //window.location.href = selectedValue; // Opens the link in the same tab
                // window.open(selectedValue, '_blank'); // Use this instead if you want to open in a new tab:
				MY_ITEM.loadAndShowFileData(selectedValue+Append_RN_TXT);
            } else {
                alert("Please select a valid option first!");
            }
        }
	</script>
	
	&nbsp; &nbsp; &nbsp; 
	<div class="btn-container" style="display:inline-block;">
        <button class="font-btn" onclick="changeFontSize(1)">A+ </button>
        <button class="font-btn" onclick="changeFontSize(-1)">A- </button>
        <button class="font-btn" onclick="resetFontSize()">Reset</button>
		<script>
			// Default size store karne ke liye variable
			const DEFAULT_SIZE = 16;
			let currentSize = DEFAULT_SIZE;
			
			function resetFontSize() {
				const table = document.getElementById("productGrid");
				currentSize = DEFAULT_SIZE;
				table.style.fontSize = DEFAULT_SIZE + "px";
			}

			function changeFontSize(action) {
				// 1. Table element ko select kiya
				const table = document.getElementById("productGrid");
				
				// 2. Font size ko increment ya decrement kiya
				currentSize += action;

				// Safe Limits: Font ko bohot chhota (10px) ya bohot bada (30px) hone se rokne ke liye
				if (currentSize < 4) currentSize = 4;
				if (currentSize > 30) currentSize = 30;

				// 3. Style apply kiya ('px' ke sath)
				table.style.fontSize = currentSize + "px";
			}

		</script>
    </div>
	
	
	<input type="text" id="searchInput" onkeyup="show_filtered_products()" placeholder="🔍 Search...">
	<div id="message"></div> 
	<div id="productGrid"></div>
	
		<script src="https://nkg26.github.io/NE/lib-js/cls-MyFile.js"></script>	
		<script src="https://nkg26.github.io/NE/resources/js/cls-MyTable.js"></script>	
  <script>  

		class PlainTable{
			FX_TABLE = new MyTable();
			table_data = [];
			
			getTabularData(){
				return this.table_data;
			}
			
			loadAndShowFileData(path){
				var myfile = new MyFile(path);
				myfile.loadFile().then(() => {
					this.analyzeData(myfile.getFinalOutput());
				});
			}
			
			analyzeData(RAW_DATA){
				this.table_data = this.FX_TABLE.splitToTable(RAW_DATA);
				try{
					//showFinalData(this.getTabularData()); comment 
					show_filtered_products();
				}catch{
					console.log(' showFinalData(this.getTabularData()); is either not implemented or any other reasion..');
				}
			}
			
			filterByText(text){
				return this.filterTabularDataByText(this.table_data, text);			
			}
		
		// isme header always return hoga..
			filterTabularDataByText(table_data, text){
				text = text.toLowerCase();
				return table_data.filter((row, rowIndex) => {
				        if (rowIndex === 0) return true; // header always chaheye..
						for(let i=0; i<row.length; i++){
							if((row[i] === null || row[i] === undefined)?false:row[i].toLowerCase().includes(text)) return true;
						}
						
					return false;
				});			
			}
		
		}
  
  const MY_ITEM = new PlainTable();
	//      showFile('https://nkg26.github.io/NE/res/lists/items-name-ifb.txt');
	//      MY_ITEM.loadAndShowFileData('https://nkg26.github.io/NE/res/txt/prch.txt');

  		function show_filtered_products(){ 
			var val = document.getElementById('searchInput').value;
			let data = MY_ITEM.filterByText(val);
			showFinalData(data);
		}
		
		function showFinalData(table_data){
		//console.log(" ------------------- ");
		//console.log(table_data);
			var html = MY_ITEM.FX_TABLE.generateBasicHtmlTable(table_data);
			document.getElementById('productGrid').innerHTML = html;
		}
  </script>
