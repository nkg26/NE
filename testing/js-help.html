<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <!-- Mobile responsiveness ke liye critical viewport tag -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NK</title>
  <style>
    /* Mobile Header (Mobile screen par show hoga) */
    .mobile-header {
      background: #4f46e5;
      color: white;
      padding: 12px 15px;
      align-items: center;
      justify-content: space-between;
    }

    .mobile-header button {
      background: rgba(255, 255, 255, 0.2);
      border: none;
      color: white;
      padding: 8px 14px;
      font-size: 16px;
      border-radius: 6px;
      cursor: pointer;
    }


    /* Center Main Content Area */
    .main-wrapper {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100vh;
      width: 100%;
    }

    .main-content {
      flex: 1;
      padding: 10px;
    }

    /* Center Iframe */
    .center-iframe {
      width: 100%;
      height: 100%;
      border: 2px solid #e5e7eb;
      border-radius: 10px;
      background: white;
    }

    /* ======================================= */
    /* Mobile Screen Responsive CSS Rules      */
    /* ======================================= */
    @media (max-width: 768px) {
      body {
        flex-direction: column;
      }

      /* Mobile header show hoga */
      .mobile-header {
        display: flex;
      }

      .main-wrapper {
        height: calc(100vh - 50px);
      }
    }
  </style>
</head>
