<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nitin Enterprises</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #fff7ed 0%, #ffedd5 50%, #fef3c7 100%);
      color: #292524;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 10px;
    }

    /* Container Box */
    .navratri-card {
      background: #ffffff;
      max-width: 750px;
      width: 100%;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 15px 30px rgba(194, 65, 12, 0.15);
      border: 2px solid #fdba74;
      margin-top: 10px;
    }

    /* Decorative Header */
    .header-banner {
      background: linear-gradient(135deg, #ea580c 0%, #dc2626 100%);
      color: #ffffff;
      text-align: center;
      padding: 35px 20px;
      position: relative;
    }

    .header-banner h1 {
      font-size: 32px;
      margin-bottom: 8px;
      font-weight: 800;
      letter-spacing: 0.5px;
    }

    .header-banner p {
      font-size: 18px;
      color: #fef08a;
      font-weight: 600;
    }

    .store-tag {
      background: rgba(255, 255, 255, 0.2);
      display: inline-block;
      padding: 5px 15px;
      border-radius: 20px;
      font-size: 14px;
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* Body Content */
    .card-body {
      padding: 30px 25px;
    }

    /* Navratri Importance Section */
    .navratri-info {
      background: #fff8f1;
      border-left: 4px solid #ea580c;
      padding: 18px;
      border-radius: 8px;
      margin-bottom: 25px;
    }

    .navratri-info h2 {
      font-size: 20px;
      color: #c2410c;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .navratri-info p {
      font-size: 15px;
      line-height: 1.6;
      color: #44403c;
    }

    /* Offers Grid Section */
    .section-title {
      font-size: 22px;
      color: #991b1b;
      text-align: center;
      margin-bottom: 20px;
      font-weight: 700;
    }

    .offers-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
      margin-bottom: 30px;
    }

    .offer-box {
      background: #fafaf9;
      border: 1px dashed #f97316;
      border-radius: 12px;
      padding: 18px 15px;
      text-align: center;
      transition: transform 0.2s;
    }

    .offer-box:hover {
      transform: translateY(-3px);
      background: #fff;
    }

    .offer-icon {
      font-size: 32px;
      margin-bottom: 10px;
    }

    .offer-box h3 {
      font-size: 16px;
      color: #ea580c;
      margin-bottom: 6px;
    }

    .offer-box p {
      font-size: 13px;
      color: #57534e;
    }

    /* Trust Highlight */
    .trust-badge {
      text-align: center;
      background: #fef2f2;
      border: 1px solid #fecaca;
      padding: 12px;
      border-radius: 10px;
      color: #991b1b;
      font-weight: 600;
      font-size: 14px;
      margin-bottom: 25px;
    }

    /* Buttons Section */
    .action-buttons {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 14px;
      text-align: center;
      text-decoration: none;
      font-weight: 700;
      font-size: 16px;
      border-radius: 10px;
      transition: all 0.3s ease;
    }

    .btn-primary {
      background: linear-gradient(135deg, #ea580c, #dc2626);
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(234, 88, 12, 0.3);
    }

    .btn-primary:hover {
      opacity: 0.95;
    }

    .btn-secondary {
      background: #ffffff;
      color: #ea580c;
      border: 2px solid #ea580c;
    }

    .btn-secondary:hover {
      background: #fff7ed;
    }

    @media (min-width: 500px) {
      .action-buttons {
        flex-direction: row;
      }
    }
  </style>
</head>
<body>

  <div class="navratri-card">
    
    <!-- Top Banner Header -->
    <div class="header-banner">
      <span class="store-tag">Nitin Enterprises</span>
    </div>

    <!-- Card Inner Content -->
    <div class="card-body">
          
      <div class="offers-grid">
        <div class="offer-box">
          <div class="offer-icon">📺</div>
          <h3>Smart LED TV</h3>
          <p>4K UHD LED TVs </strong></p>
        </div>

        <div class="offer-box">
          <div class="offer-icon">🧺</div>
          <h3>Washing Machine</h3>
          <p>Front & Top Load मॉडल्स </strong></p>
        </div>

      <!-- Trust Note -->
      <div class="trust-badge">
        ⭐ आपका वही पुराना भरोसा, अब नए डिजिटल अंदाज़ में! ⭐
      </div>

      <!-- Navigation Buttons -->
      <div class="action-buttons">
        <!-- Main Page / Dashboard Link -->
        <a href="https://nkg26.github.io/NE/2K6/offer_261004.html" class="btn btn-primary">
          Latest Offers 
        </a>
      </div>

    </div>

  </div>

</body>
</html>
