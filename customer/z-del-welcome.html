<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome Page</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #e0e7ff 0%, #f3e8ff 100%);
      padding: 20px;
    }

    .welcome-card {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 40px 30px;
      max-width: 600px;
      width: 100%;
      text-align: center;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.6);
      animation: fadeIn 0.8s ease-in-out;
    }

    .avatar-circle {
      width: 90px;
      height: 90px;
      background: linear-gradient(135deg, #6366f1, #a855f7);
      color: white;
      font-size: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      margin: 0 auto 20px auto;
      box-shadow: 0 8px 20px rgba(99, 102, 241, 0.3);
    }

    .badge {
      display: inline-block;
      background: #e0e7ff;
      color: #4338ca;
      font-size: 13px;
      font-weight: 600;
      padding: 6px 16px;
      border-radius: 20px;
      margin-bottom: 15px;
      letter-spacing: 0.5px;
    }

    .welcome-title {
      color: #1e293b;
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .highlight-name {
      color: #4f46e5;
    }

    .quote-text {
      color: #64748b;
      font-size: 16px;
      line-height: 1.6;
      margin-bottom: 30px;
      font-style: italic;
    }

    .action-btn {
      display: inline-block;
      padding: 12px 28px;
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      color: white;
      text-decoration: none;
      font-weight: 600;
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(79, 70, 229, 0.3);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .action-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(79, 70, 229, 0.4);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="welcome-card">
    <div class="avatar-circle">✨</div>
    <span class="badge">CUSTOMER HELP</span>
    <h1 class="welcome-title">Welcome, <span class="highlight-name" id="userName">Valued Customer</span>!</h1>
    
    <p class="quote-text" id="welcomeQuote">
      "Aapka hamare portal par swagat hai! Aapka waqt hamare liye keemti hai, aaiye aapke anubhav ko aur bhi behtar banate hain."
    </p>

    <a href="#" class="action-btn">Nitin Enterprises</a>
  </div>

  <script>
    // URL Parameters se Customer Name dynamically read karna
    const urlParams = new URLSearchParams(window.location.search);
    const nameParam = urlParams.get('name');

    if (nameParam) {
      document.getElementById('userName').textContent = nameParam;
    }
  </script>

</body>
</html>
